on: push

jobs:
  test:
    runs-on: ${{matrix.os}}
    name: OTP ${{matrix.otp}}
    strategy:
      fail-fast: false
      matrix:
        include:
          # hex.pm only has OTP 24 builds up to ubuntu-22.04,
          # and OTP 25 builds up to ubuntu-24.04
          - otp: '24'
            os: ubuntu-22.04
          - otp: '25'
            os: ubuntu-24.04
          - otp: '26'
            os: ubuntu-latest
          - otp: '27'
            os: ubuntu-latest
          - otp: '28'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}

      - name: Prepare prerequisites
        run: sudo apt-get update

      - name: Install prerequisites
        run: sudo apt-get install libxml2-dev python3 python3-pip

      - name: Install pyang
        run: |
          pip3 install pyang
          # Point pyang at its installed modules.  Without this, a pip
          # user install (as on ubuntu-26.04) makes pyang 2.7.1 call
          # pkgutil.find_loader, which was removed in Python 3.14.
          echo "YANG_INSTALL=$(python3 -m site --user-base)/share" >> "$GITHUB_ENV"

      - name: Install lux
        run: |
          git clone https://github.com/hawk/lux.git
          cd lux
          autoconf
          ./configure
          make

      - name: Run tests
        run: |
          export PATH=$PATH:$(pwd)/lux/bin
          source env.sh
          make
          make test

      - name: Upload lux logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lux-logs-otp-${{matrix.otp}}
          path: test/lux/**/lux_logs/
          if-no-files-found: ignore
