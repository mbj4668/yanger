on: push

jobs:
  test:
    runs-on: ${{matrix.os}}
    name: OTP ${{matrix.otp}}
    strategy:
      fail-fast: false
      matrix:
        include:
          # hex.pm only has OTP 24 builds up to ubuntu-22.04,
          # and OTP 25 builds up to ubuntu-24.04
          - otp: '24'
            os: ubuntu-22.04
          - otp: '25'
            os: ubuntu-24.04
          - otp: '26'
            os: ubuntu-latest
          - otp: '27'
            os: ubuntu-latest
          - otp: '28'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}

      - name: Prepare prerequisites
        run: sudo apt-get update

      - name: Install prerequisites
        run: sudo apt-get install libxml2-dev python3 python3-pip

      - name: Install pyang
        run: |
          pip3 install pyang
          # pip may fall back to a user install (e.g. on ubuntu-26.04),
          # which puts the pyang script in ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install lux
        run: |
          git clone https://github.com/hawk/lux.git
          cd lux
          autoconf
          ./configure
          make

      - name: Run tests
        run: |
          export PATH=$PATH:$(pwd)/lux/bin
          source env.sh
          make
          make test
